name: mitra-test

services:
  db:
    image: postgres:15.19-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    restart: unless-stopped
    environment:
      POSTGRES_USER: mitra
      POSTGRES_PASSWORD: mitra
      POSTGRES_DB: mitra
    ports:
      - "55432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitra"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db:
