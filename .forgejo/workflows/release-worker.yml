name: Optional release worker
on:
  workflow_dispatch:
    inputs:
      request:
        description: Request identity supplied by ./dev release
        required: true
        type: string
      phase:
        description: Stage supplied by ./dev release
        required: true
        type: choice
        options: [static, build]
      identity:
        description: Source and build settings supplied by ./dev release
        required: true
        type: string
      arch:
        description: Target architecture supplied by ./dev release
        required: true
        type: choice
        options: [amd64, arm64]
concurrency:
  group: optional-release-worker
  cancel-in-progress: false
jobs:
  build:
    if: inputs.phase == 'build'
    runs-on: [docker, "arch=${{ inputs.arch }}"]
    timeout-minutes: 90
    steps:
      - name: Install checkout tools
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash git python3 nodejs binutils
          else
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends bash git python3 nodejs binutils
          fi
      - uses: https://code.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bound the optional build worker
        if: inputs.phase == 'build'
        run: |
          # Capture the worker's Docker endpoint and TLS material for Buildx.
          docker context create plamenu-release-daemon
          docker buildx create --name plamenu-release-worker --driver docker-container \
            --driver-opt memory=6g --driver-opt memory-swap=12g \
            --driver-opt cpu-period=100000 --driver-opt cpu-quota=200000 \
            --use plamenu-release-daemon
      - name: Execute the same stage used locally
        env:
          RELEASE_IDENTITY: ${{ inputs.identity }}
          RELEASE_PHASE: ${{ inputs.phase }}
          RELEASE_SOURCE: ${{ forgejo.sha }}
        run: python3 scripts/release-worker.py
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        if: always()
        with:
          name: release-${{ inputs.request }}
          path: .ci/release-worker/bundle.tar.gz
          retention-days: 3
          if-no-files-found: warn
      - name: Remove the temporary build worker
        if: always() && inputs.phase == 'build'
        run: |
          if docker buildx inspect plamenu-release-worker >/dev/null 2>&1; then
            docker buildx rm plamenu-release-worker
          fi
          if docker context inspect plamenu-release-daemon >/dev/null 2>&1; then
            docker context rm --force plamenu-release-daemon
          fi
  static:
    if: inputs.phase == 'static'
    runs-on: [debian-trixie, arch=amd64]
    timeout-minutes: 90
    steps:
      - uses: https://code.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install static-check tools
        run: ./scripts/release-worker-setup.sh
      - name: Execute the same static checks used locally
        env:
          RELEASE_IDENTITY: ${{ inputs.identity }}
          RELEASE_PHASE: static
          RELEASE_SOURCE: ${{ forgejo.sha }}
        run: python3 scripts/release-worker.py
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        if: always()
        with:
          name: release-${{ inputs.request }}
          path: .ci/release-worker/bundle.tar.gz
          retention-days: 3
          if-no-files-found: warn
