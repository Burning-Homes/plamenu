[package]
name = "plamenu"
description = "Plamenu: a fast, small ActivityPub server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Only gates the executable target; the server library has no conditional CLI code.
default = ["cli"]
cli = []

# `bench = false` on the lib/bin targets keeps `cargo bench` from handing
# criterion CLI flags (--save-baseline etc.) to libtest, which rejects them.
[lib]
bench = false

[[bin]]
name = "plamenu"
path = "src/main.rs"
bench = false
required-features = ["cli"]

[dependencies]
aes-gcm = { workspace = true }
altcha = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
avif-parse = { workspace = true }
avif-serialize = { workspace = true }
base32 = { workspace = true }
base64 = { workspace = true }
blurhash = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
encoding_rs = { workspace = true }
fluent-bundle = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
md-5 = { workspace = true }
html5ever = { workspace = true }
image = { workspace = true }
jiff = { workspace = true }
lettre = { workspace = true }
maud = { workspace = true }
mimalloc = { workspace = true }
p256 = { workspace = true }
plamenu-ap = { workspace = true }
plamenu-db = { workspace = true }
plamenu-federation = { workspace = true }
pulldown-cmark = { workspace = true }
qrcode = { workspace = true }
quick_html2md = { workspace = true }
roxmltree = { workspace = true }
regex = { workspace = true }
httpdate = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sqlx = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
rtmp-rs = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-normalization = { workspace = true }
unic-langid = { workspace = true }
url = { workspace = true }
webauthn-rs = { workspace = true }
zip = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
plamenu-test-support = { path = "../test-support" }
criterion = { workspace = true }
ml-dsa = { workspace = true }
# The RFC 9421 inbox tests hand-sign requests with an actor's Ed25519 key.
ed25519-dalek = { workspace = true }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }
# aes-gcm, hkdf, p256, and zip are already normal dependencies (used by the
# push and archive workers) and so are available to tests without repeating
# them here: the push tests decrypt deliveries client-side and the archive
# tests unzip the worker's output to inspect its entries.

[lints]
workspace = true

# account_api includes these unchanged sources in one default harness, avoiding
# four copies of test code generation/linking. Explicit --test NAME still works.
[[test]]
name = "account_collections"
test = false

[[test]]
name = "applications_settings"
test = false

[[test]]
name = "account_feed"
test = false

[[test]]
name = "local_identity"
test = false

