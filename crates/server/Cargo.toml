# Hot-path latency benches against the persistent seeded plamenu_bench
# database; budgets checked by bench/bench_budgets.py (see bench/README.md).
[[bench]]
name = "hot_paths"
path = "benches/hot_paths/main.rs"
harness = false
# Never run under `cargo test` — the bench seeds and drives a large persistent
# database and is only meaningful via `cargo bench`.
test = false

# Concurrency/contention tripwire over the same plamenu_bench database: a custom
# closed-loop driver (not criterion), self-checking its own invariant + ratio
# budget. Run via `./dev bench-concurrency`.
[[bench]]
name = "contention"
path = "benches/contention/main.rs"
harness = false
test = false
