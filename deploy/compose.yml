name: plamenu

# Production images are pinned by manifest-list digest because a tag
# is mutable and a re-pushed base must not change a deploy silently. To bump,
# update the tag AND the digest together (`docker buildx imagetools inspect
# <image:tag>` prints the index digest).
services:
  db:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  plamenu:
    image: ${PLAMENU_IMAGE:?set PLAMENU_IMAGE in deploy/.env}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./plamenu.toml:/etc/plamenu/plamenu.toml:ro
      - media-data:/var/lib/plamenu/media
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [backend]

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      plamenu:
        condition: service_healthy
    environment:
      PLAMENU_DOMAIN: ${PLAMENU_DOMAIN:?set PLAMENU_DOMAIN in deploy/.env}
      PLAMENU_WEBXDC_DOMAIN: ${PLAMENU_WEBXDC_DOMAIN:?set PLAMENU_WEBXDC_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]

networks:
  backend:
    # If this range overlaps the host/VPN network, override
    # PLAMENU_BACKEND_SUBNET and update trusted_proxies in plamenu.toml to the
    # same exact range before starting the stack. See docs/operators/configuration.md.
    ipam:
      config:
        - subnet: ${PLAMENU_BACKEND_SUBNET:-172.30.0.0/24}

volumes:
  postgres-data:
  media-data:
  caddy-data:
  caddy-config:
