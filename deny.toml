[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "warn"
ignore = [
  # rsa: timing side-channel risk in RSA private-key operations, including federation signing.
  "RUSTSEC-2023-0071",
]

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Allow path-only workspace dependencies.
allow-wildcard-paths = true
highlight = "all"

# Exact versions keep new duplicates visible to the check.
skip = [
  # Older RustCrypto APIs used by WebAuthn, RSA, and X.509 dependencies.
  "aead@0.5.2",
  "aes@0.8.4",
  "aes-gcm@0.10.3",
  "base16ct@0.2.0",
  "block-buffer@0.10.4",
  "cipher@0.4.4",
  "const-oid@0.9.6",
  "cpufeatures@0.2.17",
  "crypto-bigint@0.5.5",
  "crypto-common@0.1.7",
  "ctr@0.9.2",
  "der@0.7.10",
  "digest@0.10.7",
  "ecdsa@0.16.9",
  "elliptic-curve@0.13.8",
  "ff@0.13.1",
  "ghash@0.5.1",
  "group@0.13.0",
  "hkdf@0.12.4",
  "hmac@0.12.1",
  "inout@0.1.4",
  "p256@0.13.2",
  "pem-rfc7468@0.7.0",
  "pkcs8@0.10.2",
  "polyval@0.6.2",
  "primeorder@0.13.6",
  "rfc6979@0.4.0",
  "sec1@0.7.3",
  "sha1@0.10.6",
  "sha2@0.10.9",
  "signature@2.2.0",
  "spki@0.7.3",
  "universal-hash@0.5.1",

  # Versions required by WebAuthn, HTML sanitization, and middleware dependencies.
  "base64@0.21.7",
  "base64@0.22.1",
  "cssparser@0.36.0",
  "html5ever@0.36.1",
  "markup5ever@0.36.1",
  "nom@7.1.3",
  "tendril@0.4.3",
  "thiserror@1.0.69",
  "thiserror-impl@1.0.69",
  "tower-http@0.6.11",

  # RNG, collection, and WASI dependencies using different API generations.
  "getrandom@0.2.17",
  "getrandom@0.3.4",
  "hashbrown@0.16.1",
  "r-efi@5.3.0",
  "rand@0.8.6",
  "rand@0.9.4",
  "rand_chacha@0.3.1",
  "rand_core@0.6.4",
  "rand_core@0.9.5",
  "wit-bindgen@0.51.0",
]

# Windows bindings span multiple API generations.
skip-tree = [
  { crate = "windows-sys", reason = "foundational Windows bindings have independent compatibility generations" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
