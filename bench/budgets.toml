# Hot-path calibration. Usage and recalibration: bench/README.md.
# ms: median ceiling in milliseconds. queries: SQL statement ceiling.
# bytes: response-size baseline, with a 1.15x allowance.
# ratio / ratio_of: median ratio ceiling and comparison case.
# calibrated: date of calibration. known-bad entries cannot qualify for release.
# Values are specific to the dataset and calibration machine.
# Status-rendering query ceilings include one bulk mini-app invitation lookup
# per rendered batch (two for federated public pages, profiles, and threads).
# Query counts verified 2026-09-11; timing, size, and ratio limits are unchanged.
# nplus1_guard exercises populated invitation cards as the page size grows.

